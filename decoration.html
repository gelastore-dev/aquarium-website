
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تزئینات آکواریوم | M Fish</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>M FISH</h1>
        <nav>
            <a href="index.html">خانه</a>
            <a href="product.html">محصولات</a>
            <a href="about.html">درباره ما</a>
            <a href="contact.html">تماس با ما</a>
            <a href="order.html">سبد خرید</a>
        </nav>
    </header>

    <main>
        <section class="decor-item">
            <article>
                <h2>گیاه مصنوعی آکواریوم</h2>
                <p>برای زیباتر شدن فضای آکواریوم</p>
                <img src="images/OIP (23).webp" alt="گیاه مصنوعی">
                <p class="price">250000 تومان</p>
                <button type="button" class="buy-btn"
                    onclick="buyDecoration(301)">خرید</button>
            </article>

            <article>
                <h2>سنگ و شن تزیینی</h2>
                <p>برای کف آکواریوم</p>
                <img src="images/OIP (24).webp" alt="سنگ تزیینی">
                <p class="price">689000 تومان</p>
                <button type="button" class="buy-btn"
                    onclick="buyDecoration(302)">خرید</button>
            </article>

            <article>
                <h2>چوب تزیینی</h2>
                <p>برای ساخت دکور طبیعی</p>
                <img src="images/OIP (25).webp" alt="چوب تزیینی">
                <p class="price">1580000 تومان</p>
                <button type="button" class="buy-btn"
                    onclick="buyDecoration(303)">خرید</button>
            </article>

            <article>
                <h2>مرجان مصنوعی</h2>
                <p>برای طراحی آکواریوم فانتزی</p>
                <img src="images/OIP (26).webp" alt="مرجان مصنوعی">
                <p class="price">690000 تومان</p>
                <button type="button" class="buy-btn"
                    onclick="buyDecoration(304)">خرید</button>
            </article>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>محصولات آکواریوم </title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
        <a href="cart.html" class="cart-link">
            🛒 سبد خرید
        <span id="cart-count">0</span>
        </a>
    </head>
    <body>
        
        <header class="site-header" dir="rtl">

            <div class="top-bar">

                <a href="index.html" class="logo">
                    <img src="images/IMG_1692.PNG" alt="لوگوی M Fish" class="logo-img">
                    <span class="logo-text">M Fish</span>
                </a>

                <button class="menu-btn" aria-label="باز کردن منو"
                      onclick="document.querySelector('.nav-menu').classList.toggle('active')">
                    ☰
                </button>

            </div>

            <nav class="nav-menu">
                <a href="index.html">خانه</a>
                <a href="product.html">محصولات</a>
                <a href="about.html">درباره ما</a>
                <a href="contact.html">تماس با ما</a>
           </nav>

           <section class="hero-section">
                <p class="hero-text">
                     هر آکواریوم دنیایی از زندگی
                </p>

                <img class="hero"
                     src="images/images (2).jpg"
                     alt="عکس فروشگاه">
            </section>

        </header>

        <section class="search-section">
            <h2>
                جست و جوی محصولات
            </h2>
            <input
            type="text"
            placeholder="نام محصول را وارد کنید"
            id="searchInput">
            <p id="searchMessage"></p>
        
        </section>
        
        <section class="categories">
            <h2>
                 دسته بندی محصولات
            </h2>
            <div class="category-grid">
                <a href="fish.html" class="category-card">
                    <img src="images/download (3).webp" alt="انواع ماهی">
                    <h3>
                        انواع ماهی
                    </h3>
                </a>
                <a href="equipment.html" class="category-card">
                    <img src="images/OIP (27).webp" alt="نجهیزات">
                    <h3>
                        تجهیزات
                    </h3>
                </a>
                <a href="food.html" class="category-card">
                    <img src="images/OIP (6).webp" alt="غذای ماهی">
                    <h3>
                        غذای ماهی
                    </h3>
                </a>
                <a href="decoration.html" class="category-card">
                    <img src="images/OIP (7).webp" alt="دکور و تزئینات">
                    <h3>
                        تزئینات
                    </h3>
                </a>
            </div>
        </section>
